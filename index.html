<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Pizza Ustası</title>
  <style>
    body {
      background: #fdf5e6;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    #order-card {
      background: #fff;
      border-radius: 10px;
      padding: 10px 20px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 10px;
    }
    #feedback {
      font-weight: bold;
      margin-top: 5px;
      min-height: 22px;
    }
    canvas {
      background: transparent;
      display: block;
      margin: 0 auto 10px;
    }
    .btn-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 460px;
      margin: 0 auto 10px;
    }
    button {
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #bbb;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }
    button:active { background: #eee; }
    .btn-action { background: #4caf50; color: white; border: none; }
    .btn-reset { background: #f44336; color: white; border: none; }
  </style>
</head>
<body>

  <h2>Kasa: <span id="money" style="color:green">0</span> ₺</h2>

  <div id="order-card">
    <div id="customer-text">Sipariş yükleniyor...</div>
    <div id="feedback"></div>
  </div>

  <canvas id="pizzaCanvas" width="260" height="260"></canvas>

  <div class="btn-row">
    <button onclick="applySauce()">🍅 Sos Sür</button>
    <button onclick="applyCheese()">🧀 Peynir Ekle</button>
    <button onclick="addTopping('🍄')">🍄 Mantar</button>
    <button onclick="addTopping('🥩')">🥩 Sucuk</button>
    <button onclick="addTopping('🫒')">🫒 Zeytin</button>
    <button onclick="addTopping('🌽')">🌽 Mısır</button>
  </div>

  <div class="btn-row">
    <button class="btn-reset" onclick="resetPizza()">🗑️ Temizle</button>
    <button class="btn-action" onclick="submitPizza()">🍕 Siparişi Ver</button>
  </div>

  <script>
    const canvas = document.getElementById('pizzaCanvas');
    const ctx = canvas.getContext('2d');

    // Ses Çalma Fonksiyonu
    function playAudio(freq, type = 'sine') {
      try {
        const a = new (window.AudioContext || window.webkitAudioContext)();
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, a.currentTime + 0.15);
        o.connect(g);
        g.connect(a.destination);
        o.start();
        o.stop(a.currentTime + 0.15);
      } catch(e){}
    }

    let state = {
      hasSauce: false,
      hasCheese: false,
      items: []
    };

    let totalMoney = 0;

    const orders = [
      { name: "Margarita", desc: "Sos ve Peynir", sauce: true, cheese: true, items: [], price: 80 },
      { name: "Sucuklu Pizza", desc: "Sos, Peynir ve Sucuk", sauce: true, cheese: true, items: ['🥩'], price: 110 },
      { name: "Mantarlı Pizza", desc: "Sos, Peynir ve Mantar", sauce: true, cheese: true, items: ['🍄'], price: 100 },
      { name: "Sebzeli Pizza", desc: "Sos, Peynir, Mantar, Zeytin, Mısır", sauce: true, cheese: true, items: ['🍄','🫒','🌽'], price: 130 }
    ];

    let currentOrder = null;

    function renderPizza() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Hamur tabanı
      ctx.beginPath();
      ctx.arc(130, 130, 120, 0, Math.PI * 2);
      ctx.fillStyle = '#e6a756';
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#c97d26';
      ctx.stroke();

      // Domates sosu
      if (state.hasSauce) {
        ctx.beginPath();
        ctx.arc(130, 130, 105, 0, Math.PI * 2);
        ctx.fillStyle = '#c62828';
        ctx.fill();
      }

      // Peynir katmanı
      if (state.hasCheese) {
        ctx.beginPath();
        ctx.arc(130, 130, 95, 0, Math.PI * 2);
        ctx.fillStyle = '#fbc02d';
        ctx.fill();
      }

      // Emojiler
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let item of state.items) {
        ctx.fillText(item.emoji, item.x, item.y);
      }
    }

    function applySauce() {
      state.hasSauce = true;
      renderPizza();
      playAudio(400);
    }

    function applyCheese() {
      state.hasCheese = true;
      renderPizza();
      playAudio(500);
    }

    function addTopping(emoji) {
      for (let i = 0; i < 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 60;
        state.items.push({
          emoji: emoji,
          x: 130 + radius * Math.cos(angle),
          y: 130 + radius * Math.sin(angle)
        });
      }
      renderPizza();
      playAudio(650);
    }

    function resetPizza() {
      state.hasSauce = false;
      state.hasCheese = false;
      state.items = [];
      renderPizza();
      playAudio(250);
    }

    function nextOrder() {
      currentOrder = orders[Math.floor(Math.random() * orders.length)];
      document.getElementById('customer-text').innerHTML = `
        <strong>Müşteri İstiyor:</strong> ${currentOrder.name} <br>
        <span style="color:#666; font-size:14px;">(${currentOrder.desc})</span>
      `;
      document.getElementById('feedback').innerText = '';
    }

    function submitPizza() {
      let isCorrect = true;

      if (state.hasSauce !== currentOrder.sauce || state.hasCheese !== currentOrder.cheese) {
        isCorrect = false;
      }

      const activeEmojis = [...new Set(state.items.map(i => i.emoji))].sort();
      const targetEmojis = [...currentOrder.items].sort();

      if (activeEmojis.length !== targetEmojis.length) {
        isCorrect = false;
      } else {
        for (let i = 0; i < activeEmojis.length; i++) {
          if (activeEmojis[i] !== targetEmojis[i]) isCorrect = false;
        }
      }

      const fb = document.getElementById('feedback');
      if (isCorrect) {
        totalMoney += currentOrder.price;
        document.getElementById('money').innerText = totalMoney;
        fb.style.color = 'green';
        fb.innerText = `😍 Çok lezzetli! (+${currentOrder.price} ₺)`;
        playAudio(700);
        setTimeout(() => playAudio(900), 100);
      } else {
        fb.style.color = 'red';
        fb.innerText = '😡 Bu benim siparişim değil!';
        playAudio(150, 'sawtooth');
      }

      setTimeout(() => {
        resetPizza();
        nextOrder();
      }, 1500);
    }

    // Başlat
    renderPizza();
    nextOrder();
  </script>
</body>
</html>
